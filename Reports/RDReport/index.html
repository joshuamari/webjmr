<!doctype html>
<html lang="en">
  <head>
    <title>R&D Manhour Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../MHReport/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/boxicons.css" />
    <link rel="stylesheet" href="../../tailwindcss/output.css" />
    <link rel="stylesheet" href="css/rdreport.css" />
    <script src="../js/jquery.js"></script>
    <script src="../MHReport/js/bootstrap.min.js"></script>
    <script src="../MHReport/js/tableToExcel.js"></script>
    <script src="js/main.js"></script>
  </head>

  <body>
    <div class="home-content position-relative">
      <div class="title xPrint">
        <h1>R&D Manhour Report</h1>

        <a href="../" class="backbtn">
          <i class="bx bx-left-arrow-alt fs-5"></i>
          <h5 style="font-weight: 400; font-size: 17px">Back to Reports</h5>
        </a>
      </div>
      <div class="content">
        <div class="upper py-3">
          <div class="row left pe-md-2">
            <div class="form-floating col-12 col-sm-4 col-xl-2 my-1 my-md-0 rd-group-dropdown xPrint">
              <input
                type="text"
                class="form-select"
                id="buSelDisplay"
                readonly
                placeholder="Select Group"
                aria-expanded="false"
              />
              <label for="buSelDisplay">Select Group</label>
              <div class="rd-dropdown-menu" id="groupMenu">
                <label class="rd-dropdown-item rd-select-all">
                  <input type="checkbox" id="chkAllGroups" />
                  Select all
                </label>
                <div id="groupChecks"></div>
              </div>
            </div>
            <div class="form-floating col-12 col-sm-4 col-xl-2 my-1 my-md-0">
              <input type="month" id="monthSel" class="form-control" />
              <label for="monthSel">Select Month</label>
            </div>
          </div>

          <div class="right pe-2 pe-lg-0">
            <button
              id="btnPrint"
              class="xPrint btn btn-primary"
              style="background-color: #395dc7"
              disabled
            >
              PRINT
            </button>
            <button id="btnExport" class="xPrint btn btn-outline-success" disabled>
              EXPORT
            </button>
          </div>
        </div>

        <div class="lower">
          <p id="reportCaption" class="rd-caption d-none"></p>
          <p id="emptyState" class="rd-empty d-none"></p>
          <table id="mainTable" class="rd-table"></table>
        </div>
      </div>
    </div>
  </body>
</html>
